
name: Gerar APK ADAILSON TECK TV

on:
  workflow_dispatch:
  push:
    paths:
      - 'ADAILSON_TECK_TV_projeto.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto
        run: |
          unzip -o ADAILSON_TECK_TV_projeto.zip -d projeto

      - name: Compilar APK
        run: |
          cd projeto
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: ADAILSON-TECK-TV-APK
          path: projeto/app/build/outputs/apk/debug/app-debug.apk
          
