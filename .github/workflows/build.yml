
name: Gerar APK ADAILSON TECK TV

on:
  workflow_dispatch:
  push:
    paths:
      - 'ADAILSON_TECK_TV_projeto.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extrair projeto
        run: |
          mkdir -p projeto
          unzip -o ADAILSON_TECK_TV_projeto.zip -d projeto

      - name: Encontrar e compilar APK
        run: |
          GRADLEW=$(find projeto -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "ERRO: Gradle Wrapper não encontrado"
            find projeto -maxdepth 4 -type f | head -100
            exit 1
          fi
          DIR=$(dirname "$GRADLEW")
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: ADAILSON-TECK-TV-APK
          path: projeto/**/build/outputs/apk/debug/*.apk
